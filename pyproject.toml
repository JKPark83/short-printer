[project]
name = "shorts-printer"
version = "0.1.0"
description = "주제 하나로 세로 쇼츠를 뽑는 테스트 파이프라인(MoneyPrinter 참고, Claude API)"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "edge-tts>=7.3.1",
    "fastapi",
    "fugashi>=1.5.2",
    "jinja2",
    "kiwipiepy>=0.24.0",
    "playwright>=1.64.0",
    "pydantic",
    "python-multipart>=0.0.32",
    "unidic-lite>=1.0.8",
    "uvicorn",
]

[project.scripts]
sp = "shorts_printer.cli:main"

[dependency-groups]
dev = ["httpx", "pytest", "ruff>=0.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["live: 실제 외부 API를 부른다(키 필요)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"
# 남이 만든 스킬 스크립트는 검사하지 않는다
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 옮겨 온 코드의 긴 한국어 프롬프트·문구·ASS 서식 줄(한글은 폭 2로 센다). 프롬프트 내용을 바꾸지 않으려 그대로 둔다
"src/shorts_printer/core/{script,subtitles,render,voice}.py" = ["E501"]
"src/shorts_printer/adapters/{flow_auto,youtube,youtube_studio}.py" = ["E501"]
"tests/test_{trends,voice_render,youtube}.py" = ["E501"]
