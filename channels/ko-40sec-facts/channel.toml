# 채널 설정. 키 설명은 docs/plan/multi-channel.md와 .claude/rules/channels.md
name = "40초 상식"
description = "생활 속 \"왜 그렇지?\"에 근거를 갖고 2분 안에 답해 드려요. 영상에 쓴 자료는 설명란에 적어 둡니다."
concept = "사람들에게 실제로 도움이 되는 상식"
language = "ko"
daily_goal = 1
sensitive_gate = true
llm = "claude"

[script]
scenes = 13
sentence = [52, 58]   # 크리스 기준 초당 약 7.1자: 한 장면이 7.3~8.2초, 13장면이 약 99~110초
unit = "chars"
duration = "100~110초"

[tts]
provider = "elevenlabs"
default = "PDoCXqBQFGsvfO0hNkEs"
sample = "안녕하세요. 오늘 알려 드릴 생활 꿀팁, 끝까지 보면 분명 도움이 될 거예요."

[tts.voices]   # {ElevenLabs 목소리 ID: 화면 이름}. "elevenlabs"는 .env ELEVENLABS_VOICE_ID
PDoCXqBQFGsvfO0hNkEs = "크리스"
LKOcTG4J4tYTPR9DnLeM = "미스터킴"
QPFsEL6IBxlT15xfiD6C = "이하나"
iWLjl1zCuqXRkW6494ve = "지수"
elevenlabs = "미스터최"

[video]
provider = "flow-auto"
style = "Stylized 3D animated explainer. Smooth matte materials, simple rounded shapes, one clear subject large in frame, limited palette of deep teal, cream, coral and mustard yellow, clean uncluttered sets, no readable text anywhere, signs and screens plain and blank."

[style]
accent = "#FFE500"
background = ["#0f172a", "#14532d"]
layout = "clean"   # 영상은 띠·제목 없이 9:16 전체 + 자막, 썸네일만 위아래 띠 + 제목

[thumbnail]
max_line = 12
max_total = 22

[publish]
provider = "youtube"
category = "22"
sources_heading = "출처"

[research]
domains = ["kdca.go.kr", "health.kdca.go.kr", "mfds.go.kr", "korean.go.kr", "encykorea.aks.ac.kr", "khs.go.kr",
           "scent.kisti.re.kr", "kasi.re.kr", "weather.go.kr", "kostat.go.kr", "mods.go.kr",
           "pubmed.ncbi.nlm.nih.gov", "nih.gov", "nasa.gov", "noaa.gov", "who.int"]
news = ["news.kbs.co.kr", "news.sbs.co.kr", "ytn.co.kr", "chosun.com", "joongang.co.kr", "donga.com",
        "khan.co.kr", "hankyung.com", "newsis.com", "korea.kr", "health.chosun.com",
        "bbc.com", "nature.com", "science.org", "nationalgeographic.com"]

[trends]
region = "KR"
keywords = []
production = "Claude가 공식 자료로 만든 사실 시트로 한국어 대본을 쓰고, TTS가 읽고 번인 자막이 뜬다. 약 1분 45초(100~110초), 13장면. 배경은 장면마다 AI로 만든 3D 해설 애니메이션 클립(건축·과학 해설 채널 느낌)이고, 같은 마스코트가 나온다. 직접 촬영, 실존 인물·방송·게임 화면, 특정 브랜드는 못 쓴다. 공식·학술 자료로 핵심 사실을 확인할 수 없는 주제는 못 만든다."
weights = { trend = 35, fit = 35, fresh = 15, safe = 15 }
