# 채널 설정. 키 설명은 docs/plan/multi-channel.md와 .claude/rules/channels.md
name = "ミニチュア韓国旅行"
description = """
韓国旅行・ソウル旅行の前に見たい、40秒のミニチュアガイド。
景福宮が北にある理由や市場グルメの始まりを、手のひらサイズのソウルで再現。
聖水・漢南洞のカフェ、明洞グルメ、オリーブヤングと韓国美容、地下鉄の乗り方まで、行ってすぐ使える情報をお届けします。

ソウル在住の韓国人が調べて作り、ナレーションはAI音声です。
毎日2本更新。次の韓国旅行の前に、ぜひチェックしてください。

※映像はAIで再現したイメージです。"""
concept = "일본인 한국 여행자를 위한 서울 장소의 유래·역사(3D 재현)와 맛집·쇼핑·교통 여행 꿀팁"
language = "ja"
daily_goal = 2
sensitive_gate = true
llm = "claude"

[script]
scenes = 7
sentence = [26, 31]   # 쿈 기준 초당 약 3.9자(3.4~4.5): 한 문장이 클립 8초를 거의 다 채운다
unit = "chars"
duration = "50~56초"

[tts]
provider = "elevenlabs"
default = "B8gJV1IhpuegLxdpXFOE"
sample = "こんにちは。韓国旅行の前に知っておきたいことを、40秒でお伝えします。"

[tts.voices]   # {ElevenLabs 목소리 ID: 화면 이름}. "elevenlabs"는 .env ELEVENLABS_VOICE_ID
B8gJV1IhpuegLxdpXFOE = "쿈"

[video]
provider = "flow-auto"
style = "Stylized 3D animated miniature diorama explainer: a tabletop scale model of Seoul with tilt-shift depth of field, soft clay-like matte materials, clean CGI visualization like an architecture documentary, soft even daylight, warm muted colors, same art style in every shot."

[style]
layout = "clean"   # 영상은 띠·제목 없이 9:16 전체 + 자막, 썸네일만 위아래 띠 + 제목
accent = "#FFE14D"
background = ["#0f172a", "#7f1d1d"]

[thumbnail]
max_line = 10
max_total = 18

[publish]
provider = "youtube"
category = "19"
footer = "※映像はAIで再現したイメージです。"
channel_id = "UCRYIJCDhM7pS3S7JB2aHTKw"

[trends]
region = "JP"
language = "ja"
keywords = ["韓国旅行", "ソウル旅行", "韓国グルメ", "韓国カフェ", "明洞", "聖水", "オリーブヤング", "景福宮"]
production = "Claude가 쓴 일본어 대본을 일본어 TTS가 읽고 일본어 번인 자막이 뜬다. 40~50초. 화면은 9:16 전체를 장면 클립으로 채우고 위쪽에 큰 텔롭(제목 문구)이 뜬다. 장면은 모두 AI로 만든 디오라마·클레이 미니어처풍 3D 애니메이션 클립이다(조선 시대 재현도 지금의 서울 거리도 같은 화풍). 직접 촬영·실사 영상, 남의 사진·영상, 실존 인물·연예인, 가게 간판·브랜드 로고·상품 화면은 못 쓴다."
weights = { trend = 30, fit = 35, fresh = 15, safe = 20 }
