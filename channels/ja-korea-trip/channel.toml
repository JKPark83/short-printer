# 채널 설정. 키 설명은 docs/plan/multi-channel.md와 .claude/rules/channels.md
name = "ミニチュア韓国旅行"
description = """
韓国旅行・ソウル旅行の前に見たい、2分弱のミニチュアガイド。
聖水・漢南洞のカフェ街や明洞の屋台通りを、手のひらサイズのソウルで再現。
オリーブヤングと韓国美容、地下鉄の乗り方、両替のコツまで、行ってすぐ使える情報をお届けします。

情報は韓国観光公社・ソウル市などの公式資料で確かめ、出典は概要欄に載せています。
ソウル在住の韓国人が調べて作り、ナレーションはAI音声です。

※映像はAIで再現したイメージです。"""
concept = "일본인 2030 여성 여행자를 위한 서울 동네·장소 미니어처 소개와 맛집·카페·쇼핑·뷰티·교통 여행 꿀팁"
language = "ja"
daily_goal = 1
sensitive_gate = true
llm = "claude"

[script]
scenes = 13
sentence = [50, 56]   # 미나미 기준 초당 약 7.0자: 13장면이 약 95~105초
unit = "chars"
duration = "100~110초"
llm = "claude-code"   # 대본만 Claude 구독으로(.env CLAUDE_CODE_MODEL·EFFORT)

[tts]
provider = "elevenlabs"
default = "lhTvHflPVOqgSWyuWQry"
sample = "こんにちは。韓国旅行の前に知っておきたいことをお伝えします。"

[tts.voices]   # {ElevenLabs 목소리 ID: 화면 이름}. "elevenlabs"는 .env ELEVENLABS_VOICE_ID
lhTvHflPVOqgSWyuWQry = "미나미"

[video]
provider = "flow-auto"
style = "Clean stylized 3D animated miniature diorama: a tabletop scale model with smooth matte clay and crisp toy-block miniature pieces, bold clean edges, seen up close with gentle depth of field and smooth continuous motion. Palette of cream, sage green, coral and warm wood. Signboards, packages and screens are plain and blank."

[style]
layout = "clean"   # 영상은 띠 없이 9:16 전체 + 자막, 제목은 처음 1초만. 썸네일은 위아래 띠 + 제목
accent = "#FFE14D"
background = ["#0f172a", "#7f1d1d"]
voice_lufs = -16   # 미나미 원본이 -33 LUFS로 작다
sfx_lufs = -23     # 70%로 깔려 약 -26: 목소리보다 10dB 작게

[thumbnail]
max_line = 10
max_total = 18

[publish]
provider = "youtube"
also = ["instagram"]   # 더 올리는 곳. Instagram은 바로 공개라 작업 화면에서 눌러야 올라간다
category = "19"
footer = "※映像はAIで再現したイメージです。"
channel_id = "UCRYIJCDhM7pS3S7JB2aHTKw"
sources_heading = "出典"

[research]
domains = ["visitkorea.or.kr", "visitseoul.net", "k-eta.go.kr", "immigration.go.kr", "hikorea.go.kr",
           "0404.go.kr", "anzen.mofa.go.jp", "seoulmetro.co.kr", "arex.or.kr", "airport.kr", "wowpass.io", "global.oliveyoung.com"]
news = ["www3.nhk.or.jp", "newsdig.tbs.co.jp", "news.tv-asahi.co.jp", "travelvoice.jp",
        "travel.watch.impress.co.jp", "prtimes.jp", "jp.yna.co.kr", "japanese.joins.com", "japanese.korea.net"]
languages = ["ko", "ja"]   # 한국 공식 자료는 한국어로 더 많다
open = true   # 여행 실전 정보(요금·동선·팁)는 공식 사이트에 없는 게 많아 블로그·커뮤니티도 본다
queries_per_topic = 10   # 한국어·일본어 두 언어로 주장 여럿을 확인하니 기본 5로는 모자란다
max_pages = 12

[trends]
production = "Claude가 공식 자료로 만든 사실 시트로 일본어 대본을 쓰고, 일본어 TTS가 읽고 일본어 번인 자막이 뜬다. 약 1분 45초(100~110초), 13장면, 「3選」처럼 항목 세 개로 짠다. 화면은 9:16 전체를 장면 클립으로 채우고 자막만 뜬다(제목은 썸네일에만). 장면은 모두 AI로 만든 미니어처 디오라마 3D 해설 클립이다: 지금의 서울 동네를 탁자 위 모형처럼 내려다보고 길·동선은 바닥의 선으로 보여 주며, 같은 클레이 여행자 인형이 나온다. 직접 촬영·실사 영상, 남의 사진·영상, 실존 인물·연예인, 가게 간판·브랜드 로고·상품 화면은 못 쓴다. 한국관광공사·서울시·운영사 같은 공식 자료로 확인할 수 없는 정보는 못 쓴다."
weights = { trend = 20, curious = 22, fit = 30, fresh = 10, safe = 18 }
